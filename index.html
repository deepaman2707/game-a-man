<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Space Runner iPhone Safari</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container" id="game">
    <div class="stars"></div>
    <div class="planet"></div>

    <div class="hud">
      <div>Player: <span id="playerNameDisplay">Player</span></div>
      <div>Score: <span id="score">0</span></div>
    </div>

    <div class="setup-screen" id="setupScreen">
      <h2>Space Runner</h2>
      <input type="text" id="playerNameInput" placeholder="Enter your name" />
      <input type="file" id="photoInput" accept="image/*" />
      <div class="preview-box">
        <img id="previewImg" alt="Preview" />
        <div id="previewPlaceholder">Photo Preview</div>
      </div>
      <button id="startBtn" type="button">Start</button>
    </div>

    <div class="message hidden" id="startMessage">
      Tap JUMP to Start
    </div>

    <div class="message hidden" id="gameOverScreen">
      <div id="gameOverText">Game Over</div>
      <button id="restartBtn" type="button">Restart</button>
    </div>

    <div class="player" id="player">
      <img id="playerImg" alt="Player" />
    </div>

    <button class="control-btn shoot-btn" id="shootBtn" type="button">SHOOT</button>
    <button class="control-btn jump-btn" id="jumpBtn" type="button">JUMP</button>

    <div class="ground"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
